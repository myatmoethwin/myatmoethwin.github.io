<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Myat Moe Thwin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #5b5fc7 0%, #0078d4 100%);
      color: #fff;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      text-align: center;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      padding: 50px 40px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.2);
    }
    h1 { font-size: 2.5em; margin-bottom: 10px; }
    .subtitle { opacity: 0.9; margin-bottom: 40px; font-size: 1.1em; }
    .links { display: flex; flex-direction: column; gap: 15px; }
    .link-btn {
      display: block;
      padding: 16px 24px;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 10px;
      color: #fff;
      text-decoration: none;
      font-size: 1.05em;
      transition: all 0.2s;
    }
    .link-btn:hover {
      background: rgba(255,255,255,0.25);
      transform: translateY(-2px);
    }
    .link-btn .icon { font-size: 1.3em; margin-right: 10px; }
    footer { margin-top: 40px; opacity: 0.7; font-size: 0.85em; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Myat Moe Thwin</h1>
    <p class="subtitle">Senior Systems Administrator · APAC</p>
    
    <div class="links">
      <a href="https://resume.myatmoe.info" class="link-btn">
        <span class="icon">📄</span> Resume / CV
      </a>
      <a href="https://ebooks.myatmoe.info" class="link-btn">
        <span class="icon">📚</span> eLibrary
      </a>
      <a href="https://github.com/myatmoethwin" class="link-btn">
        <span class="icon">💻</span> GitHub
      </a>
    </div>
    
    <footer>© 2026 Myat Moe Thwin</footer>
  </div>
</body>
</html>
